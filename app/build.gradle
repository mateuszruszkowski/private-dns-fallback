plugins {
    id 'com.android.application' version '9.4.1'
}
android {
    namespace 'io.github.privatednsfallback'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.privatednsfallback'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }
    buildTypes {
        personal {
            initWith release
            versionNameSuffix '-personal'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
